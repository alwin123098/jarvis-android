org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Native builds are opt-in so the first `./gradlew assembleDebug` is fast.
# Set to true (or run scripts/fetch_native.sh) once llama.cpp / whisper.cpp are
# vendored under app/src/main/cpp/third_party.
jarvis.buildNative=false
